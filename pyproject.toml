[project]
name = "market-intelligence"
version = "0.1.0"
description = "MarketPilot AI (market data, research, paper trading) and AlphaScout AI (stock research). Research and paper trading only - no live order execution."
readme = "README.md"
requires-python = ">=3.12"
# Version ranges allow patch/minor updates but block untested major versions.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<0.29",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    # Optional at runtime: only used when ANTHROPIC_API_KEY is set (AI explanations).
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
# Read-only Streamlit dashboard (pulls in pandas/pyarrow; not needed by the API).
dashboard = [
    "streamlit>=1.40,<2",
    "altair>=5,<7",
]
dev = [
    "pytest>=8.3,<10",
    "python-dotenv>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call real external APIs; they are excluded unless you pass `-m live`.
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls a real market data provider; needs credentials, network access and ALPACA_LIVE_TESTS=1",
    "db: needs a PostgreSQL test database at TEST_DATABASE_URL; skipped when unset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "tests"]
