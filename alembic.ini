# Alembic configuration. The database URL is NOT stored here: migrations/env.py
# reads DATABASE_URL from the environment / .env via the application settings.
#   alembic upgrade head      apply all migrations
#   alembic downgrade -1      undo the latest migration
#   alembic current           show the applied revision
#   alembic check             fail if models and migrations have drifted apart

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
